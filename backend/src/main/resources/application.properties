spring.profiles.active=dev
spring.application.name=rr-seafoods


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG9Dialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update
# spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.connection-timeout=20s
server.servlet.session.timeout=1200s
spring.session.jdbc.initialize-schema=always
#make changes for performance to reduce the size of resource
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024   




# logging.level.org.springframework.cache=TRACE
# Cache logging enable karo
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.cache.interceptor=TRACE

# Ehcache/specific cache provider ki logging
logging.level.org.hibernate.cache=DEBUG


# ---------------Security-----------------
logging.level.root=INFO
# logging.level.org.springframework.security=DEBUG


# -------------------JWT--------------------
pr.app.jwtCookieName= _pr_at
pr.app.jwtSecret= 
pr.app.jwtExpirationMs= 86400000
pr.app.jwtRefreshExpirationMs=604800000

# management.endpoints.web.exposure.include=caches
management.endpoints.web.exposure.include=caches
management.endpoint.caches.enabled=true
